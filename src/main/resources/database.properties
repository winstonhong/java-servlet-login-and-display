# Default JDBC settings (matches mysql/run.sh Docker user and COMPOSITEAPPS DB).
# Host: use 127.0.0.1 if 'localhost' fails (IPv6 vs IPv4). Port must match Docker -p 3306:3306.
# Driver 8.x matches mysql:latest (MySQL 8 default auth plugin).
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://127.0.0.1:3306/COMPOSITEAPPS?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
jdbc.username=mysqluser
jdbc.password=mysqlpassword
